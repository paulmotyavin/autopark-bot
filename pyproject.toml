[project]
name = "autopark-bot"
version = "0.1.0"
description = "Telegram-бот для управления автопарком (MVP)"
readme = "README.md"
authors = [
    { name = "paulmotyavin", email = "isip_p.d.motyavin@mpt.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.32.0",
    "aioboto3>=13.0",
    "aiohttp-socks>=0.11.0,<0.12.0",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3,<4.0",
    "asyncpg>=0.30.0",
    "cachetools>=5.5",
    "pydantic-settings>=2.6",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
]

[project.scripts]
autopark-bot = "autopark_bot.main:run"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "pyright>=1.1.400",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "TID"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["autopark_bot"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
